<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Aurelie Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="sitenav" style="position:relative; background:transparent;">
  <div class="logo">Aurelie</div>
  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="rooms.html">ROOMS</a>
  </div>
  <a href="booking.html" class="nav-book">Book a room</a>
  <button class="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
</nav>
<div class="nav-overlay"></div>

<section class="page-hero" style="background-image:linear-gradient(160deg, rgba(19,42,58,0.78), rgba(19,42,58,0.5)), url('https://images.unsplash.com/photo-1445019980597-93fa8acb246c?w=1600&q=80');">
  <h1 class="serif">Get in Touch</h1>
</section>

<section class="section">
  <div class="contact-wrap">
    <div class="reveal">
      <div class="contact-info">
        <div class="item">
          <div class="cicon">📍</div>
          <div><b>Address</b><span>14 Ilesa Road, Oba, Osun State, Nigeria</span></div>
        </div>
        <div class="item">
          <div class="cicon">📞</div>
          <div><b>Phone</b><span>+234 000 000 0000</span></div>
        </div>
        <div class="item">
          <div class="cicon">✉️</div>
          <div><b>Email</b><span>frontdesk@aureliehotel.com</span></div>
        </div>
        <div class="item">
          <div class="cicon">🕐</div>
          <div><b>Front desk</b><span>Open 24 hours</span></div>
        </div>
      </div>
      <div class="map-block"></div>
    </div>

    <form class="contact-form reveal reveal-delay-1">
      <h3>Send a message</h3>
      <div class="field"><label>Full name</label><input type="text"></div>
      <div class="field"><label>Email</label><input type="email"></div>
      <div class="field"><label>Message</label><textarea></textarea></div>
      <button type="submit" class="btn-primary">Send message</button>
    </form>
  </div>
</section>

<footer>
  <span>© Aurelie Hotel</span>
  <span>Ilesa Road, Osun State · +234 000 000 0000</span>
</footer>

<script src="main.js"></script>
</body>
</html>
