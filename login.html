<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Aurelie Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--ivory);">

<nav class="sitenav" style="position:relative; background:transparent; color:var(--ink);">
  <div class="logo">Aurelie</div>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="room.html">Rooms</a>
    <a href="contact.html">Contact</a>
  </div>
  <a href="booking.html" class="nav-book">Book a room</a>
  <button class="hamburger dark" aria-label="Toggle menu"><span></span><span></span><span></span></button>
</nav>
<div class="nav-overlay"></div>

<div class="auth-wrap">
  <form class="auth-card reveal in-view" id="loginForm">
    <h2 class="serif">Welcome back</h2>
    <div class="sub">Log in to manage your bookings.</div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
    <div id="loginError" style="color:#a9483a; font-size:0.85rem; margin:-8px 0 14px; display:none;"></div>
    <button type="submit" class="btn-primary" id="loginBtn">Log in</button>
    <div class="auth-switch">No account? <a href="signup.html">Sign up</a></div>
  </form>
</div>

<script src="main.js"></script>
<script type="module">
  import { logIn, getUserRole } from "./auth.js";

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.textContent = 'Logging in...';

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const user = await logIn(email, password);
      const role = await getUserRole(user.uid);
      window.location.href = (role === 'admin') ? 'dashboard-admin.html' : 'dashboard-guest.html';
    } catch (err) {
      btn.textContent = 'Log in';
      errorBox.textContent = friendlyError(err.code);
      errorBox.style.display = 'block';
    }
  });

  function friendlyError(code) {
    if (code === 'auth/invalid-email') return 'That email address looks invalid.';
    if (code === 'auth/user-not-found' || code === 'auth/invalid-credential') return 'No account matches that email and password.';
    if (code === 'auth/wrong-password') return 'Incorrect password.';
    if (code === 'auth/too-many-requests') return 'Too many attempts — please wait a moment and try again.';
    return 'Something went wrong. Please try again.';
  }
</script>
</body>
</html>
